# Redaction policy for Australian medico-legal documents: the client's decisions.
#
# Source: the client's filled-in questionnaire (docs/client_policy_decisions_filled_by_joel.docx,
# git-ignored). Every item is either replaced with a realistic fake of the same kind or kept
# exactly as it is; nothing is blanked out (Q7: covering a required item instead of replacing it
# is its own failure, NOT_REPLACED, reported separately from leaks).
#
# Differences from au-medicolegal@0.1.0-draft:
# - professionals' names, organisations, their contact details, every identifier and every
#   signature, mark, avatar and photo are now required (Q1, Q2, Q5, Q6);
# - dates of birth, ages, suburbs and towns mentioned on their own, places of birth, occupation,
#   physical description, family composition and cultural background must be kept (Q3, Q4, Q9);
# - addresses are split in GT 0.2: the street line is an ADDRESS, the suburb, state and postcode
#   a LOCATION/locality;
# - handwriting follows the type rules: a handwritten date or suburb is kept like its typed form.
#
# Departures from the client's answers (since 1.1.0; listed under `deviations`, shown in every report):
# - whole-address (Q4): the whole address is replaced, street line and locality alike. The project
#   owner decided on 2026-10-22 that tools 1 and 2 replace whole addresses, and the scores hold every
#   tool scored under this policy to that rule; it is not tied to the check of the rule-based address
#   splits of GT 0.2, and only the owner can lift it. A suburb or town mentioned on its own is still
#   kept.
# - role-words (Q10): role words such as "the claimant" are left as they are; they are not in GT,
#   so changing them only counts as damage to ordinary words. To be confirmed with the client.
#
# 1.1.1 changed wording only ('tools 1 and 2', one more sentence in the whole-address effect): its
# rules digest is the same as 1.1.0's, so a run given 1.1.0 and scored under 1.1.1 is told only the
# wording changed.
#
# Differences from 1.1.1 (1.2.0, released with eval-0.4; new rules, so a new rules digest):
# - shared_roles: the structure a realistic fake may keep at the same place, read from GT by position
#   (docs/metrics.md, "Shared words"): an address's box, designator, street-type, corner, 'via', DX,
#   country and capital-city words; the state of a locality together with its postcode's prefix digits
#   (a same-state fake) and its country word; an organisation's legal form; an email's domain; an
#   identifier's letter prefix; a phone number's national prefix. The owner decided these on
#   2026-10-22 and 2026-10-29. Every other character of a required item must still change;
# - places-kept also keeps places named after a label of their kind (place_of_birth, place_of_injury,
#   place_of_accident, place_of_incident) and streets named without a house number in running text
#   (street), as the owner ruled on 2026-10-22 (rulings 2 and 3); in 1.1.1 they were MAY.
#
# Still open: quasi-identifiers the questionnaire did not ask about (religion, education,
# qualifications, marital, benefit or employment status, accreditation, courses) stay MAY.
schema: rb.policy/0.1
name: au-medicolegal
version: 1.2.0
description: >
  The client's decisions of 2026-10-18: replace every person, organisation, contact detail,
  identifier, signature and image of a person with a fake; keep every date, age, occupation and
  clinical or legal content, and suburbs and towns mentioned on their own. Departs from the
  answers in two places (see deviations): whole addresses are replaced, and role words are kept.
  A fake may keep the structure listed under shared_roles (the owner's decisions of 2026-10-22 and
  2026-10-29).
consistency_scope: matter          # Q8: same fake for a person across the matter's documents

rules:
  # --- people and their marks (Q1, Q6) ------------------------------------------
  - id: names-everyone
    when:
      type: [PERSON_NAME]
    requirement: MUST
    action: replace
    note: Private persons and professionals alike (Q1).

  - id: signatures-marks-images
    when:
      type: [SIGNATURE, HANDWRITTEN_MARK, IMAGE_PII]
    requirement: MUST
    action: replace
    note: Replaced with a synthetic stand-in (another signature, avatar or silhouette), never a box (Q6).

  # --- contact details (Q2) ----------------------------------------------------------
  - id: contact-details
    when:
      type: [ADDRESS, PHONE, EMAIL, URL]
    requirement: MUST
    action: replace
    note: Persons' and organisations' alike. ADDRESS is the street line (GT 0.2 split).

  # --- organisations (Q2) ------------------------------------------------------------
  - id: organisations
    when:
      type: [ORGANISATION]
    requirement: MUST
    action: replace

  # --- identifiers (Q5) --------------------------------------------------------------
  - id: identifiers
    when:
      type: [ID_GOVERNMENT, ID_FINANCIAL, ID_CLAIM, ID_LEGAL_REF, ID_PROVIDER, ID_BUSINESS, ID_OTHER, FILE_PATH]
    requirement: MUST
    action: replace

  # --- kept as they are (Q3, Q4, Q9) -----------------------------------------------
  - id: dates-kept
    when:
      type: [DATE]
    requirement: MUST_NOT
    note: Every date, dates of birth included (Q3).

  - id: ages-kept
    when:
      type: [AGE]
    requirement: MUST_NOT
    note: Including children's ages (Q3, Q4).

  - id: address-locality-replaced
    when:
      type: [LOCATION]
      subtype: [locality]
    requirement: MUST
    action: replace
    note: The suburb, state and postcode of an address are replaced with its street line; the project owner
      decided on 2026-10-22 that tools 1 and 2 replace whole addresses, and the scores hold every tool scored
      under this policy to that rule (deviation whole-address; the client keeps them, Q4).

  - id: places-kept
    when:
      type: [LOCATION]
      subtype: [suburb, city, region, state, country, postcode, place_of_declaration, place_of_birth,
                place_of_injury, place_of_accident, place_of_incident, street]
    requirement: MUST_NOT
    note: Suburbs, towns and places of birth mentioned on their own (Q4). A place written right after a label
      naming its kind (birth, injury, accident, incident, declaration) is kept, postcode included, and so is a
      street named without a house number in running text (the owner's rulings 2 and 3 of 2026-10-22).

  - id: quasi-identifiers-kept
    when:
      type: [QUASI_IDENTIFIER]
      subtype: [occupation, physical, family_composition, cultural_background]
    requirement: MUST_NOT
    note: Occupation, physical description (Q4); family relationships, cultural background (Q9).

  # --- protected non-PII content (Q16: losing it fails the document) ----------------
  - id: protected-content
    when:
      target: classified
    requirement: MUST_NOT
    note: Clinical terms, medications, eponyms, citations, homographs, boilerplate, placeholders.

default_mention: MAY
default_classified: MUST_NOT
optional_words: MAY

# Structure a realistic fake may keep (eval-0.4; docs/metrics.md, "Shared words"). The words and
# characters holding these roles are read from GT by their place in the mention, never from a tool's
# output; they are left out of every residual and are never the replacement on their own. A title
# ('Dr') needs no entry: GT holds it as an optional (MAY) word.
shared_roles:
  - types: [ADDRESS]
    roles: [box_kind, designator, street_type, corner, via, dx, country, capital_city_phrase]
    note: The owner decided on 2026-10-22 that a realistic fake may share a word with the original at the
      same place, such as a street-type word or the 'PO Box' words. The same holds for the other structure
      words of the street line (unit, level and building designators, corner and 'via' words, 'DX', the
      country and 'IN YOUR CAPITAL CITY'). The street type is shared only as the street's last word after a
      name word; house, unit, box and DX numbers and every name word must change.

  - types: [LOCATION]
    subtypes: [locality]
    roles: [state, pc_prefix, country]
    note: Fake addresses stay in the same state (the owner, 2026-10-22). The state, in any written form, and
      the postcode's prefix digits ('2' NSW and ACT, '3' VIC, '4' QLD, '5' SA, '6' WA, '7' TAS, '08' NT) are
      shared only together, and only where the prefix is still the original's glyph; every later postcode
      digit and the suburb must change. The country word stays (the owner's ruling on overseas addresses,
      2026-10-22).

  - types: [ORGANISATION]
    roles: [legal_form]
    note: A fake organisation may keep its trailing legal form (Pty, Ltd, Limited, Proprietary, Inc,
      Incorporated) after a name word (the owner, 2026-10-29).

  - types: [EMAIL]
    roles: [email_domain]
    note: A fake may keep the email's '@' and domain after a non-empty local part (the owner, 2026-10-29).
      The local part is still searched on its own, so a changed domain cannot hide a kept local part.

  - types: [ID_CLAIM, ID_PROVIDER, ID_LEGAL_REF, ID_GOVERNMENT, ID_BUSINESS, ID_FINANCIAL, ID_OTHER]
    roles: [id_prefix]
    note: A fake may keep an identifier's prefix of one to four capitals and its separator when digits
      follow ('CLM-'; the owner, 2026-10-29). The digits are still searched on their own.

  - types: [PHONE]
    roles: [phone_prefix]
    note: A fake phone number may keep its national structure prefix (a mobile's '04', '+61', the '13' of a
      6-digit number, '1300' or '1800', a bracketed area code '(0X)'; the owner, 2026-10-29). The remaining
      digits must change and are searched on their own, so a changed prefix cannot hide them.

# Deliberate departures from the client's answers. Scoring copies them into its results and every
# run report and comparison board shows them, so nobody reads these scores as the client's rules.
deviations:
  - id: whole-address
    question: Q4
    client_answer: Suburbs and towns are kept (Q4); the client's profile also keeps postcodes.
    applied: >-
      The whole address is replaced: street line, suburb, state and postcode. A suburb or town
      mentioned on its own is still kept.
    reason: >-
      The project owner's rule: on 2026-10-22 the owner decided that tools 1 and 2 replace whole
      addresses, and the scores hold every tool scored under this policy to that rule. It began on
      2026-10-21, when GT 0.2 split each address into street line and locality by a rule no person had
      checked; checking the splits does not end it. Only the owner can lift it, and the localities of
      addresses would then be kept again.
    effect: >-
      A tool that keeps the suburb and postcode of an address, as the client asked, is scored as leaking
      them. A suburb kept on its own elsewhere can still reveal the real suburb of the address it
      accompanies.
    rules: [address-locality-replaced]

  - id: role-words
    question: Q10
    client_answer: Role words such as 'the claimant' or 'the employer' also count.
    applied: >-
      Role words are left as they are. They are not in the ground truth, so changing them only
      counts as damage to ordinary words.
    reason: Decided by the project owner on 2026-10-21; to be confirmed with the client.
    rules: []
