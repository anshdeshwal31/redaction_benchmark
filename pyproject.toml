[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redaction-benchmark"
version = "0.1.0.dev0"
description = "Neutral evaluation framework for PII redaction of Australian medico-legal PDFs"
requires-python = ">=3.11"
# Exact pins: renderer and imaging versions change pixels, and evaluation results
# must be reproducible (PLAN.md §14.3).
dependencies = [
    "pymupdf==1.28.2",
    "pikepdf==10.16.0",
    "pypdfium2==5.13.0",
    "numpy==2.4.6",
    "opencv-python-headless==5.0.0.93",
    "shapely==2.1.2",
    "rapidfuzz==3.14.6",
    "pydantic==2.13.5",
    "PyYAML==6.0.3",
    "scipy==1.17.1",
    "pillow==12.3.0",
    "pyarrow==25.0.1",
    "duckdb==1.5.6",
    "Jinja2==3.1.6",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-xdist==3.8.0", "hypothesis==6.168.3"]
# The side-by-side demo web app (demo/README.md): Flask pages served by Waitress.
demo = ["Flask==3.1.3", "Werkzeug==3.1.9", "waitress==3.0.2"]

[project.scripts]
rb = "benchmark.cli:main"

[tool.setuptools.packages.find]
include = ["benchmark*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 3 workers, each test file on one worker (some runner tests reuse an earlier test's run). Memory is
# the limit: 3 workers peaked at about 11.5 GB used on the 15 GB laptop. Run one test serially with -n 0.
addopts = "-n 3 --dist loadfile"
filterwarnings = ["ignore:The `fitz` API is deprecated"]
markers = [
    "calibration: slow eval-0.4 calibration and full self-check tests on fictional outputs; on by default, skipped with --skip-calibration or RB_SKIP_CALIBRATION=1",
]
